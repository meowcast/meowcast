[package]
name = "miracast-ui"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
description = "10-foot launcher for the RK3228A dongle: custom GLES2 renderer for Mali-400 (Lima)"
publish = false

# Dependencies, chosen to keep the GPU path trivial and the binary small. Licences are
# (all GPLv3-compatible):
# - drm 0.14          MIT          KMS: connector/mode/CRTC, legacy modeset + page flips
# - gbm 0.18          MIT          scanout buffers (Mesa libgbm) for EGL; drm-support only
# - khronos-egl 6     MIT/Apache   EGL on the GBM platform, linked against Mesa libEGL
# - glow 0.18         MIT/Apache   OpenGL ES 2.0 bindings (functions via eglGetProcAddress)
# - ab_glyph 0.2      Apache-2.0   lazy glyph outlines + rasteriser (glyphs cached in the atlas)
# - tiny-skia 0.12    BSD-3        one-time CPU artwork: rounded slices, shadow, ring, icons
# - libc 0.2          MIT/Apache   poll, signals, mkfifo, localtime_r
# - zune-jpeg         MIT/Apache/Zlib  wallpaper decode (asset from appd), pure Rust, no deps
# - meow-app (path)   GPL-3.0+     the app SDK's volume pop-up renderer (apps/sdk, feature "osd"): the
#                                  launcher and the apps show the same pop-up; no further crates
[dependencies]
drm = "0.14"
gbm = { version = "0.18", default-features = false, features = ["drm-support"] }
khronos-egl = { version = "6", features = ["static", "no-pkg-config"] }
glow = "0.18"
ab_glyph = { version = "0.2", default-features = false, features = ["std"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
libc = "0.2"
zune-jpeg = { version = "0.5", default-features = false, features = ["std"] }
meow-app = { path = "../apps/sdk", features = ["osd"] }

[profile.release]
lto = true
panic = "abort"
codegen-units = 1
strip = true
opt-level = "s"
