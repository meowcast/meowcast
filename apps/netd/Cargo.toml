[package]
name = "meow-netd"
version = "0.1.0"
description = "meow network daemon: Wi-Fi station + setup access point, pilot app server and pairing, network debug bridge"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Dependencies (licences, all GPLv3-compatible):
# - libc 0.2            MIT/Apache   getrandom, getifaddrs, mkfifo, poll, kill
# - serde_json 1        MIT/Apache   pilot API bodies
# - sha2 0.10           MIT/Apache   hashes and PAKE key confirmation
# - spake2 0.4          MIT/Apache   password-authenticated developer pairing
# - curve25519-dalek 4.1.3 MIT/BSD   strict PAKE subgroup validation (also used by spake2)
# - base64 0.22         MIT/Apache   SSH public key validation
# - serde 1             MIT/Apache   developer credential storage
# - qrcodegen 1.8       MIT          QR codes for the TV (join the setup network, open the pilot)
[dependencies]
libc = "0.2"
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
qrcodegen = "1.8"
spake2 = "0.4"
curve25519-dalek = { version = "4.1.3", default-features = false }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }

[lib]
name = "meow_netd"
path = "src/lib.rs"
