[binaries]
c = 'arm-linux-gnueabihf-gcc'
cpp = 'arm-linux-gnueabihf-g++'
ar = 'arm-linux-gnueabihf-ar'
strip = 'arm-linux-gnueabihf-strip'
pkg-config = 'pkg-config'

[built-in options]
c_args = ['-mcpu=cortex-a7', '-mfpu=neon-vfpv4', '-mfloat-abi=hard']
cpp_args = ['-mcpu=cortex-a7', '-mfpu=neon-vfpv4', '-mfloat-abi=hard']
pkg_config_path = ['/build/mesa-install/usr/lib/pkgconfig']

[properties]
needs_exe_wrapper = true
pkg_config_libdir = ['/build/mesa-install/usr/lib/pkgconfig', '/usr/lib/arm-linux-gnueabihf/pkgconfig', '/usr/share/pkgconfig']

[host_machine]
system = 'linux'
cpu_family = 'arm'
cpu = 'armv7'
endian = 'little'
